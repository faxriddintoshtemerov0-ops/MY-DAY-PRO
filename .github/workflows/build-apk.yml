
name: Build MY DAY PRO APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          unzip -o MY_DAY_PRO_ANDROID_GITHUB_BUILD.zip
          cd MY_DAY_PRO_ANDROID
          gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MY-DAY-PRO-APK
          path: MY_DAY_PRO_ANDROID/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
